<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex">
<title>Painel | Orquidário C3M</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="max-w-4xl mx-auto px-4 py-8">
  <h1 class="display text-3xl font-bold">Painel do Orquidário C3M</h1>
  <section id="login" class="card p-6 mt-6 max-w-sm">
    <form id="loginForm">
      <label class="field" style="margin-top:0">Senha do painel<input type="password" id="senha" required autocomplete="current-password"></label>
      <button class="btn btn-primary w-full mt-4" type="submit">Entrar</button>
      <p id="loginErr" class="text-sm mt-3" style="color:#C0392B" hidden></p>
    </form>
  </section>
  <section id="painel" hidden>
    <div class="flex flex-wrap justify-between items-center gap-3 mt-6">
      <div class="flex gap-2"><button id="tabP" class="btn btn-primary !py-2" type="button">Produtos</button><button id="tabB" class="btn btn-ghost !py-2" type="button">Banner da home</button></div>
      <button id="sair" class="btn btn-ghost !py-2" type="button">Sair</button>
    </div>
    <div id="secP">
      <div class="flex flex-wrap justify-between items-center gap-3 mt-5"><p class="muted" id="resumo"></p><button id="novo" class="btn btn-primary" type="button">+ Novo produto</button></div>
      <div id="lista" class="mt-4 grid gap-3"></div>
    </div>
    <div id="secB" hidden>
      <form id="bForm" class="card p-5 mt-5">
        <p class="muted text-sm">Este é o banner grande no topo da página inicial. Deixe a imagem vazia para usar o fundo padrão.</p>
        <label class="field">Título<input name="titulo" maxlength="120"></label>
        <label class="field">Texto de apoio<input name="subtitulo" maxlength="200"></label>
        <div class="grid grid-cols-2 gap-3">
          <label class="field">Texto do botão<input name="botaoTexto" maxlength="40"></label>
          <label class="field">Link do botão<input name="botaoLink" maxlength="200" placeholder="categoria.html"></label>
        </div>
        <label class="field">Imagem do banner (computador, ideal 1920×800)<input type="file" id="bFile" accept="image/*"></label>
        <div id="bPrev" class="mt-2"></div>
        <label class="field">Imagem para celular (opcional, ideal 900×1200)<input type="file" id="bFileM" accept="image/*"></label>
        <div id="bPrevM" class="mt-2"></div>
        <button class="btn btn-primary mt-5" id="bSalvar" type="submit">Salvar banner</button>
        <p id="bErr" class="text-sm mt-3" style="color:#C0392B" hidden></p>
      </form>
    </div>
  </section>
</div>

<dialog id="prod" aria-labelledby="pTitle">
  <div class="ck-head"><h2 id="pTitle" class="display text-2xl font-bold">Produto</h2><button type="button" id="pClose" class="ck-x" aria-label="Fechar">✕</button></div>
  <form id="pForm" class="ck-body">
    <label class="field" style="margin-top:0">Nome<input name="nome" required maxlength="60"></label>
    <label class="field">Espécie (cria o menu automaticamente)<input name="esp" list="espList" maxlength="40" placeholder="Ex.: Phalaenopsis"></label>
    <datalist id="espList"></datalist>
    <div class="grid grid-cols-3 gap-3">
      <label class="field">Preço (R$)<input name="preco" type="number" step="0.01" min="0.01" required inputmode="decimal"></label>
      <label class="field">Custo (R$)<input name="custo" type="number" step="0.01" min="0" inputmode="decimal"></label>
      <label class="field">Estoque total<input name="estoque" type="number" min="0" step="1" required inputmode="numeric"></label>
    </div>
    <p class="muted text-xs mt-1">Estoque total = tudo que já entrou, inclusive o que já foi vendido. Para repor, some a quantidade nova.</p>
    <label class="field">Descrição curta (aparece nos cartões)<input name="descricao" maxlength="120"></label>
    <label class="field">Descrição completa (página do produto)<textarea name="descricaoLonga" rows="5" maxlength="1500"></textarea></label>
    <label class="field">Etiqueta (opcional)<input name="etiqueta" maxlength="25" placeholder="Ex.: Mais vendida"></label>
    <label class="field">Ilustração, se não houver foto
      <select name="estilo"><option value="branca">Branca</option><option value="rosa">Rosa</option><option value="pintada">Pintada</option><option value="roxa">Roxa</option><option value="amarela">Amarela</option></select></label>
    <p class="field">Fotos (a primeira é a capa; até 8)</p>
    <div id="fotosBox" class="mt-1"></div>
    <label class="field">Enviar fotos<input type="file" id="arquivo" accept="image/*" multiple></label>
    <div class="flex gap-2 items-end"><label class="field flex-1">ou endereço (URL) de uma foto<input id="urlFoto" maxlength="500" placeholder="https://..."></label><button class="btn btn-ghost !py-2" id="addUrl" type="button">Adicionar</button></div>
    <label class="field flex items-center gap-2" style="font-weight:600"><input type="checkbox" name="ativo" checked style="width:auto;min-height:0;margin:0"> Visível no site</label>
    <button class="btn btn-primary w-full mt-4" id="pSalvar" type="submit">Salvar produto</button>
    <p id="pErr" class="text-sm mt-3" style="color:#C0392B" hidden></p>
  </form>
</dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="js/config.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
