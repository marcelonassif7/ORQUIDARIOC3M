<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex">
<title>Painel de produtos | Orquidário C3M</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="max-w-4xl mx-auto px-4 py-8">
  <h1 class="display text-3xl font-bold">Painel de produtos</h1>
  <section id="login" class="card p-6 mt-6 max-w-sm">
    <form id="loginForm">
      <label class="field" style="margin-top:0">Senha do painel<input type="password" id="senha" required autocomplete="current-password"></label>
      <button class="btn btn-primary w-full mt-4" type="submit">Entrar</button>
      <p id="loginErr" class="text-sm mt-3" style="color:#C0392B" hidden></p>
    </form>
  </section>
  <section id="painel" hidden>
    <div class="flex flex-wrap justify-between items-center gap-3 mt-6">
      <p class="muted" id="resumo"></p>
      <div class="flex gap-2"><button id="novo" class="btn btn-primary" type="button">+ Novo produto</button><button id="sair" class="btn btn-ghost" type="button">Sair</button></div>
    </div>
    <div id="lista" class="mt-4 grid gap-3"></div>
  </section>
</div>

<dialog id="prod" aria-labelledby="pTitle">
  <div class="ck-head"><h2 id="pTitle" class="display text-2xl font-bold">Produto</h2><button type="button" id="pClose" class="ck-x" aria-label="Fechar">✕</button></div>
  <form id="pForm" class="ck-body">
    <label class="field" style="margin-top:0">Nome<input name="nome" required maxlength="60"></label>
    <div class="grid grid-cols-3 gap-3">
      <label class="field">Preço (R$)<input name="preco" type="number" step="0.01" min="0.01" required inputmode="decimal"></label>
      <label class="field">Custo (R$)<input name="custo" type="number" step="0.01" min="0" inputmode="decimal"></label>
      <label class="field">Estoque total<input name="estoque" type="number" min="0" step="1" required inputmode="numeric"></label>
    </div>
    <p class="muted text-xs mt-1">Estoque total = tudo que já entrou, inclusive o que já foi vendido. Para repor, some a quantidade nova.</p>
    <label class="field">Descrição curta<input name="descricao" maxlength="120"></label>
    <label class="field">Etiqueta (opcional)<input name="etiqueta" maxlength="25" placeholder="Ex.: Mais vendida"></label>
    <label class="field">Ilustração, quando não houver foto
      <select name="estilo"><option value="branca">Branca</option><option value="rosa">Rosa</option><option value="pintada">Pintada</option><option value="roxa">Roxa</option><option value="amarela">Amarela</option></select></label>
    <label class="field">Foto (opcional)<input type="file" id="arquivo" accept="image/*"></label>
    <div id="preview" class="mt-2"></div>
    <label class="field">ou endereço (URL) da foto<input name="foto" maxlength="500" placeholder="https://..."></label>
    <label class="field flex items-center gap-2" style="font-weight:600"><input type="checkbox" name="ativo" checked style="width:auto;min-height:0;margin:0"> Visível no site</label>
    <button class="btn btn-primary w-full mt-4" id="pSalvar" type="submit">Salvar produto</button>
    <p id="pErr" class="text-sm mt-3" style="color:#C0392B" hidden></p>
  </form>
</dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="js/admin.js"></script>
</body>
</html>
